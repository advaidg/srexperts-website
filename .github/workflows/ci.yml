name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://srexperts.in
          NEXT_PUBLIC_CONTACT_EMAIL: hello@srexperts.in
